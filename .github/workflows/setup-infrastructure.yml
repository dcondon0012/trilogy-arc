# ─────────────────────────────────────────────────────────────────────────────
# One-time foundations for the Arc pipeline. Run this ONCE, by hand, before the
# first deploy.yml run.
#
# It creates the things Terraform cannot create for itself:
#   1. the S3 bucket that holds Terraform state (versioned + encrypted)
#   2. the DynamoDB table that locks that state
#   3. the GitHub OIDC provider + IAM role, so Actions can stop using a
#      long-lived access key
#
# Every step is idempotent — re-running it is safe and changes nothing.
# ─────────────────────────────────────────────────────────────────────────────
name: Setup infrastructure (one-time)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type SETUP to proceed'
        required: true
        default: ''

permissions:
  contents: read
  id-token: write # OIDC — this workflow now authenticates via the role it created

env:
  AWS_REGION: us-west-2
  LOCK_TABLE: trilogy-arc-tflock
  ROLE_NAME: github-actions-arc
  GH_REPO: dcondon0012/trilogy-arc

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm
        run: |
          if [ "${{ inputs.confirm }}" != "SETUP" ]; then
            echo "::error::Type SETUP in the confirm input to run this."
            exit 1
          fi

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::306077570168:role/github-actions-arc
          aws-region: ${{ env.AWS_REGION }}

      - name: Identify the account
        id: acct
        run: |
          ID=$(aws sts get-caller-identity --query Account --output text)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          echo "bucket=trilogy-arc-tfstate-$ID" >> "$GITHUB_OUTPUT"
          echo "Account: $ID"

      # ── 1. State bucket ──────────────────────────────────────────────────
      - name: Create the Terraform state bucket
        env:
          BUCKET: ${{ steps.acct.outputs.bucket }}
        run: |
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "Bucket $BUCKET already exists."
          else
            aws s3api create-bucket --bucket "$BUCKET" \
              --region "$AWS_REGION" \
              --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            echo "Created $BUCKET."
          fi

          # Versioning: state file history is the only undo for a bad apply.
          aws s3api put-bucket-versioning --bucket "$BUCKET" \
            --versioning-configuration Status=Enabled

          # Encryption at rest.
          aws s3api put-bucket-encryption --bucket "$BUCKET" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"},"BucketKeyEnabled":true}]}'

          # State holds database endpoints and secret ARNs — never public.
          aws s3api put-public-access-block --bucket "$BUCKET" \
            --public-access-block-configuration \
            'BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true'

          echo "Bucket configured: versioned, encrypted, private."

      # ── 2. Lock table ────────────────────────────────────────────────────
      - name: Create the state lock table
        run: |
          if aws dynamodb describe-table --table-name "$LOCK_TABLE" >/dev/null 2>&1; then
            echo "Table $LOCK_TABLE already exists."
          else
            aws dynamodb create-table \
              --table-name "$LOCK_TABLE" \
              --attribute-definitions AttributeName=LockID,AttributeType=S \
              --key-schema AttributeName=LockID,KeyType=HASH \
              --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$LOCK_TABLE"
            echo "Created $LOCK_TABLE."
          fi

      # ── 3. OIDC provider + role ──────────────────────────────────────────
      - name: Create the GitHub OIDC provider
        id: oidc
        run: |
          ARN="arn:aws:iam::${{ steps.acct.outputs.id }}:oidc-provider/token.actions.githubusercontent.com"
          if aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$ARN" >/dev/null 2>&1; then
            echo "OIDC provider already exists."
          else
            aws iam create-open-id-connect-provider \
              --url https://token.actions.githubusercontent.com \
              --client-id-list sts.amazonaws.com \
              --thumbprint-list \
                6938fd4d98bab03faadb97b34396831e3780aea1 \
                1c58a3a8518e8759bf075b76b750d4f2df264fcd
            echo "Created the OIDC provider."
          fi
          echo "arn=$ARN" >> "$GITHUB_OUTPUT"

      - name: Create the Actions deploy role
        env:
          PROVIDER_ARN: ${{ steps.oidc.outputs.arn }}
        run: |
          cat > /tmp/trust.json <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": { "Federated": "$PROVIDER_ARN" },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
                },
                "StringLike": {
                  "token.actions.githubusercontent.com:sub": "repo:$GH_REPO:*"
                }
              }
            }]
          }
          EOF

          if aws iam get-role --role-name "$ROLE_NAME" >/dev/null 2>&1; then
            aws iam update-assume-role-policy --role-name "$ROLE_NAME" \
              --policy-document file:///tmp/trust.json
            echo "Role $ROLE_NAME exists — trust policy refreshed."
          else
            aws iam create-role --role-name "$ROLE_NAME" \
              --assume-role-policy-document file:///tmp/trust.json \
              --description "Terraform + ECS deploys for Arc, via GitHub Actions OIDC"
            echo "Created $ROLE_NAME."
          fi

          # AdministratorAccess mirrors the terraform-admin user this replaces.
          # Worth narrowing once the resource set stops changing (see DEPLOYMENT.md).
          aws iam attach-role-policy --role-name "$ROLE_NAME" \
            --policy-arn arn:aws:iam::aws:policy/AdministratorAccess

      # ── What to do next ──────────────────────────────────────────────────
      - name: Next steps
        env:
          BUCKET: ${{ steps.acct.outputs.bucket }}
          ACCT: ${{ steps.acct.outputs.id }}
        run: |
          {
            echo "### Foundations ready"
            echo ""
            echo "| Resource | Name |"
            echo "|---|---|"
            echo "| State bucket | \`$BUCKET\` |"
            echo "| Lock table | \`$LOCK_TABLE\` |"
            echo "| Actions role | \`arn:aws:iam::$ACCT:role/$ROLE_NAME\` |"
            echo ""
            echo "#### 1. Enable the backend"
            echo "In \`deploy/terraform/main.tf\`, uncomment the backend block and set:"
            echo ""
            echo '```hcl'
            echo '  backend "s3" {'
            echo "    bucket         = \"$BUCKET\""
            echo '    key            = "arc/terraform.tfstate"'
            echo "    region         = \"$AWS_REGION\""
            echo "    dynamodb_table = \"$LOCK_TABLE\""
            echo '    encrypt        = true'
            echo '  }'
            echo '```'
            echo ""
            echo "Commit and push to dev. deploy.yml refuses to run until this is done."
            echo ""
            echo "#### 2. Switch to OIDC"
            echo "In both workflows, replace the two \`aws-access-key-id\`/\`aws-secret-access-key\`"
            echo "lines with:"
            echo ""
            echo '```yaml'
            echo "          role-to-assume: arn:aws:iam::$ACCT:role/$ROLE_NAME"
            echo '```'
            echo ""
            echo "Then delete the terraform-admin key in IAM, remove both repo secrets,"
            echo "and update \`claude/17_Arc_Ops_Access.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
