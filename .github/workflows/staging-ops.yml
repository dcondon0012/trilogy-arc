# ─────────────────────────────────────────────────────────────────────────────
# Staging ops — the AWS-side stage 5 verifications, run where AWS is reachable.
#
# Why this exists: the sandbox egress proxy blocks AWS endpoints, so no Claude
# session can inspect logs, exercise S3, or drill RDS directly. Actions can.
# It also cannot read Actions LOGS or ARTIFACTS back (results-receiver and
# blob.core.windows.net are both off the allowlist), so this workflow returns
# its findings two ways that ARE readable from a sandbox:
#   1. one step per check, exiting on its own verdict — visible in the jobs API
#   2. a markdown report pushed to the `ops-results` branch — readable over git
#
# How to run it:
#   Donny, in the UI: Actions → Staging ops → Run workflow. (workflow_dispatch
#   only appears once the file is on the default branch, which happens at stage
#   6; until then use the branch route below.)
#   A worker session: write .github/ops-request.json and push to `ops-run`:
#     {"tasks": "logs,sns,s3,suite"}
#   `ops-run` is not a deploy trigger, so running ops never redeploys anything.
#
# Nothing here applies Terraform and nothing here touches prod.
#
# Shell note: Actions runs `bash -e`, so a bare `[ x ] && y` line aborts the
# step whenever the test is false. Every conditional below is an `if` block on
# purpose — the failure signal has to mean the CHECK failed, nothing else.
# ─────────────────────────────────────────────────────────────────────────────
name: Staging ops

on:
  push:
    branches: [ops-run]
  workflow_dispatch:
    inputs:
      tasks:
        description: 'Comma-separated: logs, sns, s3, suite, rds-drill (or all)'
        required: false
        default: 'logs,sns,s3,suite'

permissions:
  contents: write   # pushes the report to the ops-results branch
  id-token: write   # OIDC

env:
  AWS_REGION: us-west-2
  ENVNAME: staging
  EXPECTED_ASSERTIONS: 313

concurrency:
  group: arc-staging-ops
  cancel-in-progress: false

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }

      # A dispatch carries an input; a push to ops-run carries a request file.
      - id: tasks
        name: Resolve which checks to run
        # Through env, not interpolated into the script: a dispatch input is
        # caller-controlled text and `${{ }}` inside a shell line is an
        # injection point.
        env:
          TASKS_IN: ${{ inputs.tasks }}
        run: |
          T="$TASKS_IN"
          if [ -z "$T" ] && [ -f .github/ops-request.json ]; then
            T=$(python3 -c "import json;print(json.load(open('.github/ops-request.json')).get('tasks',''))")
          fi
          if [ -z "$T" ]; then T="logs,sns,s3,suite"; fi
          if [ "$T" = "all" ]; then T="logs,sns,s3,suite,rds-drill"; fi
          echo "list=$T" >> "$GITHUB_OUTPUT"
          echo "Running: $T"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::306077570168:role/github-actions-arc
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: '1.9.8' }

      # Read the real resource names out of state rather than guessing them.
      - id: tf
        name: Read staging outputs from Terraform state
        run: |
          cd deploy/terraform
          terraform init -input=false >/dev/null
          terraform workspace select "$ENVNAME"
          for o in alb_dns uploads_bucket db_endpoint; do
            V=$(terraform output -raw "$o")
            echo "$o=$V" >> "$GITHUB_OUTPUT"
            echo "$o = $V"
          done

      - name: Start the report
        run: |
          mkdir -p .ops
          {
            echo "# Staging ops — run ${{ github.run_number }}"
            echo
            echo "- commit: \`${{ github.sha }}\`"
            echo "- checks requested: \`${{ steps.tasks.outputs.list }}\`"
            echo "- started: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
            echo "- ALB: \`${{ steps.tf.outputs.alb_dns }}\`"
            echo "- uploads bucket: \`${{ steps.tf.outputs.uploads_bucket }}\`"
            echo "- db endpoint: \`${{ steps.tf.outputs.db_endpoint }}\`"
            echo
          } > .ops/report.md

      # ── CloudWatch ────────────────────────────────────────────────────────
      # Generates a little traffic first: an idle service logs nothing, and
      # "no events" would otherwise be indistinguishable from "logging broken".
      - name: CloudWatch — group, streams, recent events, credential scan
        if: contains(steps.tasks.outputs.list, 'logs')
        env:
          ALB: ${{ steps.tf.outputs.alb_dns }}
        run: |
          set -u
          GROUP="/ecs/arc-staging"
          FAIL=0
          for i in $(seq 1 12); do
            curl -fsS -m 10 "http://$ALB/api/health" >/dev/null 2>&1 || true
            sleep 1
          done

          {
            echo "## CloudWatch — \`$GROUP\`"
            echo
          } >> .ops/report.md

          NAME=$(aws logs describe-log-groups --log-group-name-prefix "$GROUP" \
                   --query "logGroups[?logGroupName=='$GROUP'].logGroupName | [0]" --output text)
          if [ "$NAME" = "$GROUP" ]; then
            RET=$(aws logs describe-log-groups --log-group-name-prefix "$GROUP" \
                    --query "logGroups[?logGroupName=='$GROUP'].retentionInDays | [0]" --output text)
            echo "- log group exists (retention: \`$RET\` — \`None\` means never expire)" >> .ops/report.md
          else
            echo "- **FAIL** log group \`$GROUP\` does not exist" >> .ops/report.md
            FAIL=1
          fi

          STREAMS=$(aws logs describe-log-streams --log-group-name "$GROUP" \
                      --order-by LastEventTime --descending --max-items 5 \
                      --query 'logStreams[].logStreamName' --output text 2>/dev/null || true)
          NS=$(echo "$STREAMS" | wc -w)
          echo "- $NS recent stream(s): \`$(echo "$STREAMS" | cut -c1-150)\`" >> .ops/report.md
          if [ "$NS" -lt 1 ]; then
            echo "- **FAIL** no log streams in the group" >> .ops/report.md
            FAIL=1
          fi

          aws logs tail "$GROUP" --since 2h --format short > /tmp/cw.txt 2>/dev/null || true
          LINES=$(wc -l < /tmp/cw.txt)
          echo "- $LINES event(s) in the last 2h (after 12 health probes)" >> .ops/report.md
          if [ "$LINES" -lt 1 ]; then
            echo "- **FAIL** no events even after generating traffic" >> .ops/report.md
            FAIL=1
          fi

          if grep -q "Trilogy Platform API on" /tmp/cw.txt; then
            echo "- boot line seen: \`$(grep -m1 -o 'Trilogy Platform API on.*' /tmp/cw.txt | cut -c1-90)\`" >> .ops/report.md
          else
            echo "- no boot line in this window (expected unless a task restarted)" >> .ops/report.md
          fi

          # Credential shapes are a hard fail. PHI-shaped hits are reported for
          # a human to read, not failed: request paths legitimately carry record
          # ids, and a false red here trains people to ignore the check.
          {
            echo
            echo "### Credential scan (hard fail)"
          } >> .ops/report.md
          CRED=0
          for PAT in 'postgres://' 'postgresql://' 'BEGIN [A-Z ]*PRIVATE KEY' 'AKIA[0-9A-Z]{16}' 'SESSION_SECRET' 'aws_secret_access_key'; do
            N=$(grep -Eic -- "$PAT" /tmp/cw.txt || true)
            if [ "${N:-0}" -gt 0 ]; then
              echo "- **FAIL** \`$PAT\` × $N" >> .ops/report.md
              CRED=1
            fi
          done
          if [ "$CRED" -eq 0 ]; then
            echo "- clean — no credential pattern appears" >> .ops/report.md
          else
            FAIL=1
          fi

          {
            echo
            echo "### PHI-shaped strings (reported, not failed)"
          } >> .ops/report.md
          PHI=0
          for PAT in 'PT-1[0-9]{4}' '[0-9]{3}-[0-9]{2}-[0-9]{4}' 'dateOfBirth' '[0-9]{3}-[0-9]{3}-[0-9]{4}'; do
            N=$(grep -Eic -- "$PAT" /tmp/cw.txt || true)
            if [ "${N:-0}" -gt 0 ]; then
              echo "- \`$PAT\` × $N" >> .ops/report.md
              PHI=1
            fi
          done
          if [ "$PHI" -eq 0 ]; then
            echo "- none seen in this window" >> .ops/report.md
          fi

          {
            echo
            echo "<details><summary>last 40 log lines</summary>"
            echo
            echo '```'
            tail -40 /tmp/cw.txt
            echo '```'
            echo "</details>"
            echo
          } >> .ops/report.md
          exit "$FAIL"

      # ── S3, infrastructure level ──────────────────────────────────────────
      - name: S3 — posture and a direct round trip
        if: contains(steps.tasks.outputs.list, 's3')
        env:
          BUCKET: ${{ steps.tf.outputs.uploads_bucket }}
        run: |
          set -u
          FAIL=0
          {
            echo "## S3 — \`$BUCKET\`"
            echo
          } >> .ops/report.md

          PAB=$(aws s3api get-public-access-block --bucket "$BUCKET" \
                  --query 'PublicAccessBlockConfiguration.[BlockPublicAcls,BlockPublicPolicy,IgnorePublicAcls,RestrictPublicBuckets]' \
                  --output text)
          echo "- public access block: \`$PAB\`" >> .ops/report.md
          if echo "$PAB" | grep -qi "false"; then
            echo "- **FAIL** a public-access guard is off" >> .ops/report.md
            FAIL=1
          fi

          SSE=$(aws s3api get-bucket-encryption --bucket "$BUCKET" \
                  --query 'ServerSideEncryptionConfiguration.Rules[0].ApplyServerSideEncryptionByDefault.SSEAlgorithm' \
                  --output text)
          echo "- default encryption: \`$SSE\`" >> .ops/report.md
          if [ "$SSE" != "aws:kms" ]; then
            echo "- **FAIL** expected aws:kms" >> .ops/report.md
            FAIL=1
          fi

          VER=$(aws s3api get-bucket-versioning --bucket "$BUCKET" --query 'Status' --output text)
          echo "- versioning: \`$VER\`" >> .ops/report.md
          if [ "$VER" != "Enabled" ]; then
            echo "- **FAIL** versioning not enabled" >> .ops/report.md
            FAIL=1
          fi

          # Round trip on a probe key, then remove it. Versioned bucket, so the
          # version goes too — the drill leaves nothing behind.
          K="ops-probe/${{ github.run_id }}.txt"
          echo "s3 round trip ${{ github.run_id }}" > /tmp/probe.txt
          aws s3api put-object --bucket "$BUCKET" --key "$K" --body /tmp/probe.txt >/dev/null
          aws s3api get-object --bucket "$BUCKET" --key "$K" /tmp/probe-back.txt >/dev/null
          if cmp -s /tmp/probe.txt /tmp/probe-back.txt; then
            echo "- direct put/get round trip: byte-identical" >> .ops/report.md
          else
            echo "- **FAIL** round trip content differed" >> .ops/report.md
            FAIL=1
          fi
          OBJSSE=$(aws s3api head-object --bucket "$BUCKET" --key "$K" --query 'ServerSideEncryption' --output text)
          echo "- probe object stored with: \`$OBJSSE\`" >> .ops/report.md
          for V in $(aws s3api list-object-versions --bucket "$BUCKET" --prefix "$K" \
                       --query 'Versions[].VersionId' --output text); do
            aws s3api delete-object --bucket "$BUCKET" --key "$K" --version-id "$V" >/dev/null || true
          done
          echo "- probe object and its version deleted" >> .ops/report.md

          BEFORE=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "uploads/" --query 'KeyCount' --output text)
          echo "$BEFORE" > /tmp/uploads_before
          {
            echo "- app objects under \`uploads/\` before the suite: **$BEFORE**"
            echo
          } >> .ops/report.md
          exit "$FAIL"

      # ── The app itself, through the ALB ───────────────────────────────────
      # api-test.ts is pure HTTP (BASE env var, no db import), so this needs no
      # database reachability and no extra secret — the checklist's "needs a
      # staging DATABASE_URL secret" was a wrong premise.
      #
      # Its upload/download assertion doubles as the S3 live test: with
      # S3_UPLOADS_BUCKET set, persistUploads moves the staged file to S3 and
      # unlinks the local copy, so a byte-identical readback can only have come
      # from S3.
      - name: Full api suite against the staging ALB
        if: contains(steps.tasks.outputs.list, 'suite')
        env:
          ALB: ${{ steps.tf.outputs.alb_dns }}
        run: |
          set -u
          npm ci --silent
          {
            echo "## Full api suite against the ALB"
            echo
          } >> .ops/report.md

          B=""
          for i in $(seq 1 30); do
            B=$(curl -fsS -m 10 "http://$ALB/api/health" 2>/dev/null | sed -n 's/.*"build":"\([^"]*\)".*/\1/p')
            if [ -n "$B" ]; then break; fi
            sleep 5
          done
          echo "- serving build: \`${B:-<no response>}\`" >> .ops/report.md
          if [ -z "$B" ]; then
            echo "- **FAIL** the ALB never answered /api/health" >> .ops/report.md
            exit 1
          fi

          set +e
          BASE="http://$ALB" npx tsx scripts/api-test.ts > /tmp/alb-suite.log 2>&1
          RC=$?
          set -e
          OK=$(grep -c '^ok:' /tmp/alb-suite.log || true)
          BAD=$(grep -c '^FAIL:' /tmp/alb-suite.log || true)
          echo "- exit code \`$RC\` · passed **${OK:-0}** · failed **${BAD:-0}** (floor $EXPECTED_ASSERTIONS)" >> .ops/report.md

          if [ "${BAD:-0}" -gt 0 ]; then
            {
              echo
              echo "Failed assertions:"
              echo '```'
              grep '^FAIL:' /tmp/alb-suite.log | head -40
              echo '```'
            } >> .ops/report.md
          fi
          {
            echo
            echo "<details><summary>last 25 lines of suite output</summary>"
            echo
            echo '```'
            tail -25 /tmp/alb-suite.log
            echo '```'
            echo "</details>"
            echo
          } >> .ops/report.md

          # Re-runs: the admin's TOTP secret persists by design, so the
          # enrollment assertion only holds against a staging database that has
          # never had an admin login. Say so rather than letting the next run
          # look like a regression.
          if grep -q "^FAIL: first login" /tmp/alb-suite.log; then
            {
              echo "> The MFA-enrollment assertion fails on a SECOND run against the same staging"
              echo "> database — the secret is stored at first enrollment. Re-running wants the"
              echo "> admin's MFA reset or a fresh staging database, not a code change."
              echo
            } >> .ops/report.md
          fi

          if [ "$RC" -ne 0 ]; then exit 1; fi
          if [ "${OK:-0}" -lt "$EXPECTED_ASSERTIONS" ]; then
            echo "- **FAIL** only ${OK:-0} assertions ran (floor $EXPECTED_ASSERTIONS)" >> .ops/report.md
            exit 1
          fi
          exit 0

      - name: S3 — confirm the suite's uploads landed in the bucket
        if: contains(steps.tasks.outputs.list, 's3') && contains(steps.tasks.outputs.list, 'suite')
        env:
          BUCKET: ${{ steps.tf.outputs.uploads_bucket }}
        run: |
          set -u
          AFTER=$(aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "uploads/" --query 'KeyCount' --output text)
          BEFORE=$(cat /tmp/uploads_before 2>/dev/null || echo 0)
          {
            echo "## S3 — the app's own upload path"
            echo
            echo "- objects under \`uploads/\`: $BEFORE → **$AFTER**"
            echo
            echo '```'
            aws s3api list-objects-v2 --bucket "$BUCKET" --prefix "uploads/" \
              --query 'Contents[0:5].[Key,Size]' --output text 2>/dev/null || true
            echo '```'
            echo
          } >> .ops/report.md
          if [ "${AFTER:-0}" -le "${BEFORE:-0}" ]; then
            echo "- **FAIL** the suite uploaded files but no new object appeared — the app is not writing to S3" >> .ops/report.md
            exit 1
          fi
          echo "- the suite's uploads reached S3 through the app's storage layer" >> .ops/report.md
          exit 0

      # ── Alarms and their delivery path ────────────────────────────────────
      # "Confirm the SNS subscription" really means "prove an alarm reaches a
      # human". So: check the subscription is confirmed, check each alarm is
      # wired to the topic, then push one alarm into ALARM for real and let it
      # publish. arc-staging-5xx-spike is the one used deliberately — it has
      # alarm_actions and no ok_actions, so the test sends exactly one email.
      # set-alarm-state is temporary; the next metric evaluation resets it, and
      # treat_missing_data=notBreaching means that lands back on OK by itself.
      - name: Alarms — subscription confirmed, wiring, live delivery test
        if: contains(steps.tasks.outputs.list, 'sns')
        run: |
          set -u
          TOPIC="arn:aws:sns:us-west-2:306077570168:arc-staging-alerts"
          FAIL=0
          {
            echo "## Alarms and delivery"
            echo
          } >> .ops/report.md

          SUBS=$(aws sns list-subscriptions-by-topic --topic-arn "$TOPIC" \
                   --query 'Subscriptions[].[Protocol,Endpoint,SubscriptionArn]' --output text)
          if [ -z "$SUBS" ]; then
            echo "- **FAIL** the topic has no subscriptions at all" >> .ops/report.md
            FAIL=1
          fi
          PENDING=0
          echo "$SUBS" | while IFS= read -r L; do
            if [ -n "$L" ]; then echo "- subscription: \`$L\`" >> .ops/report.md; fi
          done
          if echo "$SUBS" | grep -q "PendingConfirmation"; then
            PENDING=1
            {
              echo "- **FAIL** the email subscription is still \`PendingConfirmation\` — alarms are silent."
              echo "  Donny has to open the \"AWS Notification - Subscription Confirmation\" mail"
              echo "  (sent 16:55Z on 09/04, valid 3 days) and click Confirm subscription."
            } >> .ops/report.md
            FAIL=1
          else
            echo "- email subscription is confirmed" >> .ops/report.md
          fi

          for A in arc-staging-no-healthy-tasks arc-staging-5xx-spike arc-staging-db-cpu; do
            INFO=$(aws cloudwatch describe-alarms --alarm-names "$A" \
                     --query 'MetricAlarms[0].[StateValue,ActionsEnabled]' --output text 2>/dev/null || true)
            HAS=$(aws cloudwatch describe-alarms --alarm-names "$A" \
                    --query "MetricAlarms[0].AlarmActions[?@=='$TOPIC'] | length(@)" --output text 2>/dev/null || echo 0)
            echo "- \`$A\`: state/actions \`$INFO\`, wired to topic: \`$HAS\`" >> .ops/report.md
            if [ "${HAS:-0}" -lt 1 ]; then
              echo "  - **FAIL** not wired to the alerts topic" >> .ops/report.md
              FAIL=1
            fi
          done

          if [ "$PENDING" -eq 0 ]; then
            MARK="staging-ops delivery test run ${{ github.run_number }}"
            aws cloudwatch set-alarm-state --alarm-name arc-staging-5xx-spike \
              --state-value ALARM --state-reason "$MARK" >/dev/null
            sleep 20
            aws cloudwatch set-alarm-state --alarm-name arc-staging-5xx-spike \
              --state-value OK --state-reason "staging-ops test complete" >/dev/null
            {
              echo "- fired \`arc-staging-5xx-spike\` into ALARM with reason \"$MARK\", then reset it to OK"
              echo "- one alarm email should now be in the alert inbox — the session checks for it"
            } >> .ops/report.md
          else
            echo "- delivery test skipped: nothing would arrive while the subscription is pending" >> .ops/report.md
          fi
          echo >> .ops/report.md
          exit "$FAIL"

      # ── RDS backup/restore drill ──────────────────────────────────────────
      # Snapshot staging, restore it beside itself, confirm the restore comes
      # up, then delete it. Row-level verification is deliberately NOT
      # attempted: RDS sits in private subnets, so checking contents would mean
      # a one-off in-VPC task with the master credential passed through a
      # container override. Metadata-only, and labelled as such.
      - name: RDS — snapshot, restore, verify, delete
        if: contains(steps.tasks.outputs.list, 'rds-drill')
        run: |
          set -u
          SRC="arc-staging-pg"
          FAIL=0
          DRILL="arc-staging-pg-drill-${{ github.run_id }}"
          SNAP="arc-staging-snap-${{ github.run_id }}"
          echo "$DRILL" > /tmp/drill_id
          echo "$SNAP"  > /tmp/snap_id
          {
            echo "## RDS backup/restore drill"
            echo
          } >> .ops/report.md

          INFO=$(aws rds describe-db-instances --db-instance-identifier "$SRC" \
            --query 'DBInstances[0].[BackupRetentionPeriod,StorageEncrypted,MultiAZ,DBInstanceClass,DBInstanceStatus,LatestRestorableTime]' \
            --output text)
          RET=$(echo "$INFO" | cut -f1); ENC=$(echo "$INFO" | cut -f2)
          MAZ=$(echo "$INFO" | cut -f3); CLS=$(echo "$INFO" | cut -f4)
          ST=$(echo "$INFO"  | cut -f5); LRT=$(echo "$INFO" | cut -f6)
          {
            echo "- source \`$SRC\`: retention **${RET}d**, encrypted \`$ENC\`, multi-AZ \`$MAZ\`, \`$CLS\`, \`$ST\`"
            echo "- latest restorable time: \`$LRT\`"
          } >> .ops/report.md
          if [ "${RET:-0}" -lt 1 ]; then
            echo "- **FAIL** automated backups are off" >> .ops/report.md
            FAIL=1
          fi
          if [ "$ENC" != "True" ]; then
            echo "- **FAIL** source instance is not encrypted" >> .ops/report.md
            FAIL=1
          fi

          T0=$(date +%s)
          aws rds create-db-snapshot --db-instance-identifier "$SRC" --db-snapshot-identifier "$SNAP" >/dev/null
          aws rds wait db-snapshot-available --db-snapshot-identifier "$SNAP"
          T1=$(date +%s)
          SZ=$(aws rds describe-db-snapshots --db-snapshot-identifier "$SNAP" \
                 --query 'DBSnapshots[0].AllocatedStorage' --output text)
          echo "- snapshot completed in **$((T1-T0))s** (${SZ}GB allocated)" >> .ops/report.md

          SG=$(aws rds describe-db-instances --db-instance-identifier "$SRC" \
                 --query 'DBInstances[0].VpcSecurityGroups[0].VpcSecurityGroupId' --output text)
          SUBNET=$(aws rds describe-db-instances --db-instance-identifier "$SRC" \
                 --query 'DBInstances[0].DBSubnetGroup.DBSubnetGroupName' --output text)
          aws rds restore-db-instance-from-db-snapshot \
            --db-instance-identifier "$DRILL" --db-snapshot-identifier "$SNAP" \
            --db-instance-class db.t4g.micro --no-multi-az \
            --db-subnet-group-name "$SUBNET" --vpc-security-group-ids "$SG" \
            --no-deletion-protection --no-publicly-accessible >/dev/null
          aws rds wait db-instance-available --db-instance-identifier "$DRILL"
          T2=$(date +%s)

          RINFO=$(aws rds describe-db-instances --db-instance-identifier "$DRILL" \
            --query 'DBInstances[0].[DBInstanceStatus,EngineVersion,AllocatedStorage,StorageEncrypted]' --output text)
          RST=$(echo "$RINFO" | cut -f1); REN=$(echo "$RINFO" | cut -f2)
          RSZ=$(echo "$RINFO" | cut -f3); RENC=$(echo "$RINFO" | cut -f4)
          {
            echo "- restored \`$DRILL\` in **$((T2-T1))s** — status \`$RST\`, engine \`$REN\`, ${RSZ}GB, encrypted \`$RENC\`"
            echo "- **snapshot to a running restored database: $(( (T2-T0)/60 ))m $(( (T2-T0)%60 ))s**"
          } >> .ops/report.md
          if [ "$RST" != "available" ]; then
            echo "- **FAIL** restored instance never reached available" >> .ops/report.md
            FAIL=1
          fi
          if [ "$RSZ" != "$SZ" ]; then
            echo "- **FAIL** restored storage ${RSZ}GB does not match snapshot ${SZ}GB" >> .ops/report.md
            FAIL=1
          fi
          {
            echo "- not checked: row-level contents — see the note in claude/16 for why"
            echo
          } >> .ops/report.md
          exit "$FAIL"

      # Runs even if the drill failed halfway. The identifier guards mean a bug
      # in the step above can never point these deletes at the real instance.
      - name: RDS — tear the drill down
        if: always() && contains(steps.tasks.outputs.list, 'rds-drill')
        run: |
          set -u
          D=$(cat /tmp/drill_id 2>/dev/null || true)
          S=$(cat /tmp/snap_id 2>/dev/null || true)
          echo "### Teardown" >> .ops/report.md
          if [ -n "$D" ] && echo "$D" | grep -q -- "-drill-"; then
            if aws rds delete-db-instance --db-instance-identifier "$D" \
                 --skip-final-snapshot --delete-automated-backups >/dev/null 2>&1; then
              echo "- delete requested for instance \`$D\`" >> .ops/report.md
            else
              echo "- instance \`$D\` was not there to delete" >> .ops/report.md
            fi
          fi
          if [ -n "$S" ] && echo "$S" | grep -q -- "arc-staging-snap-"; then
            if aws rds delete-db-snapshot --db-snapshot-identifier "$S" >/dev/null 2>&1; then
              echo "- delete requested for snapshot \`$S\`" >> .ops/report.md
            else
              echo "- snapshot \`$S\` was not there to delete" >> .ops/report.md
            fi
          fi
          echo >> .ops/report.md

      # ── Return the findings over git, the one channel a sandbox can read ──
      # Cloned to a temp dir so the working checkout is never mutated.
      - name: Publish the report to the ops-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          if [ ! -f .ops/report.md ]; then echo "no report to publish"; exit 0; fi
          echo "- finished: $(date -u '+%Y-%m-%d %H:%M:%SZ')" >> .ops/report.md
          cp .ops/report.md /tmp/report.md
          STAMP=$(date -u '+%Y%m%dT%H%M%SZ')
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rm -rf /tmp/pub
          if git clone --depth 1 --branch ops-results "$URL" /tmp/pub 2>/dev/null; then
            echo "appending to existing ops-results branch"
          else
            mkdir -p /tmp/pub
            git -C /tmp/pub init -q
            git -C /tmp/pub remote add origin "$URL"
            git -C /tmp/pub checkout -q -b ops-results
          fi
          mkdir -p /tmp/pub/results
          cp /tmp/report.md "/tmp/pub/results/${STAMP}-run${{ github.run_number }}.md"
          cp /tmp/report.md /tmp/pub/results/latest.md
          git -C /tmp/pub config user.name "github-actions[bot]"
          git -C /tmp/pub config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/pub add results
          git -C /tmp/pub commit -q -m "Staging ops run ${{ github.run_number }} ($STAMP)"
          git -C /tmp/pub push -q origin ops-results
          echo "Report pushed to ops-results: results/${STAMP}-run${{ github.run_number }}.md"

      - name: Summary
        if: always()
        run: cat .ops/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
