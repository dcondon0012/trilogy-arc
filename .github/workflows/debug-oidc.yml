# TEMPORARY — diagnose and repair the OIDC trust that failed deploy run #7
# ("Not authorized to perform sts:AssumeRoleWithWebIdentity"). Uses the
# still-present AWS key secrets to inspect and fix, then proves OIDC works
# in a second job. Delete this file once deploy.yml goes green on OIDC.
#
# ROOT CAUSE (found by the claims printout): GitHub's OIDC sub claim now
# embeds immutable numeric IDs — this repo presents
#   repo:dcondon0012@321908854/trilogy-arc@1348898879:ref:refs/heads/dev
# so the plain "repo:owner/repo:*" pattern never matches. The trust policy
# below accepts both forms; the ID-pinned one is the stronger condition
# (numeric IDs survive renames and can't be re-registered by squatters).
name: Debug OIDC (temporary)

on:
  push:
    branches: [dev]
    paths: ['.github/workflows/debug-oidc.yml']

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2
  ACCT: '306077570168'
  ROLE_NAME: github-actions-arc
  GH_REPO: dcondon0012/trilogy-arc

jobs:
  # ── 1. Inspect + repair, authenticated with the access key ────────────────
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Show the OIDC provider as it actually exists
        run: |
          PROV="arn:aws:iam::$ACCT:oidc-provider/token.actions.githubusercontent.com"
          echo "=== Providers in the account ==="
          aws iam list-open-id-connect-providers --output table
          echo "=== token.actions.githubusercontent.com provider detail ==="
          aws iam get-open-id-connect-provider --open-id-connect-provider-arn "$PROV" --output json

      - name: Show the role trust policy as it actually exists
        run: |
          aws iam get-role --role-name "$ROLE_NAME" \
            --query 'Role.AssumeRolePolicyDocument' --output json

      - name: Repair — ensure the sts.amazonaws.com audience is registered
        run: |
          PROV="arn:aws:iam::$ACCT:oidc-provider/token.actions.githubusercontent.com"
          IDS=$(aws iam get-open-id-connect-provider \
            --open-id-connect-provider-arn "$PROV" \
            --query 'ClientIDList' --output text)
          echo "Current audiences: $IDS"
          if ! echo "$IDS" | grep -qw "sts.amazonaws.com"; then
            aws iam add-client-id-to-open-id-connect-provider \
              --open-id-connect-provider-arn "$PROV" \
              --client-id sts.amazonaws.com
            echo "Added sts.amazonaws.com to the provider's audiences."
          else
            echo "Audience already present."
          fi

      - name: Repair — rewrite the role trust policy to the known-good form
        run: |
          cat > /tmp/trust.json <<EOF
          {
            "Version": "2012-10-17",
            "Statement": [{
              "Effect": "Allow",
              "Principal": { "Federated": "arn:aws:iam::$ACCT:oidc-provider/token.actions.githubusercontent.com" },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
                },
                "StringLike": {
                  "token.actions.githubusercontent.com:sub": [
                    "repo:$GH_REPO:*",
                    "repo:dcondon0012@321908854/trilogy-arc@1348898879:*"
                  ]
                }
              }
            }]
          }
          EOF
          cat /tmp/trust.json
          aws iam update-assume-role-policy --role-name "$ROLE_NAME" \
            --policy-document file:///tmp/trust.json
          echo "Trust policy rewritten."

  # ── 2. Prove OIDC works, with NO key secrets in this job ──────────────────
  prove-oidc:
    needs: repair
    runs-on: ubuntu-latest
    steps:
      # The config in AWS looks textbook-correct, yet STS says no. So look at
      # what GitHub ACTUALLY sends: fetch the OIDC token and print its claims
      # (iss/aud/sub — public metadata, not a secret; the token itself is
      # never printed). If sub or iss differs from what the trust policy
      # expects, that's the answer.
      - name: Show the token's actual claims
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOK=$(echo "$RESP" | jq -r .value)
          PAYLOAD=$(echo "$TOK" | cut -d. -f2)
          python3 -c "
          import base64, json, sys
          p = sys.argv[1]; p += '=' * (-len(p) % 4)
          c = json.loads(base64.urlsafe_b64decode(p))
          keep = ('iss','aud','sub','repository','repository_owner','ref','event_name')
          print(json.dumps({k: c[k] for k in keep if k in c}, indent=2))" "$PAYLOAD"

      - name: Raw STS call (full error text, if it fails)
        run: |
          RESP=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          TOK=$(echo "$RESP" | jq -r .value)
          aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::306077570168:role/github-actions-arc \
            --role-session-name debug-oidc \
            --web-identity-token "$TOK" \
            --query 'AssumedRoleUser.Arn' --output text || echo "(raw call failed — error above)"
        env:
          AWS_DEFAULT_REGION: us-west-2

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::306077570168:role/github-actions-arc
          aws-region: us-west-2

      - name: Who am I?
        run: |
          aws sts get-caller-identity --output json
          echo "OIDC works. Re-run the latest Deploy Arc run's failed jobs, then delete this workflow."
