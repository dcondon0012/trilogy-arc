# Local development stack for the Postgres migration work.
# `docker compose -f deploy/docker-compose.yml up -d pg` gives the conversion stages
# a real PostgreSQL to test against; the app service mirrors the Fargate container.
services:
  pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trilogy
      POSTGRES_PASSWORD: trilogy-local-only
      POSTGRES_DB: trilogy
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trilogy"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports: ["4000:4000"]
    environment:
      DATABASE_URL: postgres://trilogy:trilogy-local-only@pg:5432/trilogy
      TRILOGY_DISABLE_MFA: "1"
    depends_on:
      pg:
        condition: service_healthy
    volumes: [appdata:/data]

volumes:
  pgdata:
  appdata:
